<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <style>
        /* Base Reset & Typography */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { height: 100vh; overflow: hidden; background-color: #f9f9f9; }

        /* Split Screen Layout */
        .split-layout { display: flex; height: 100vh; width: 100vw; }

        /* Form Side */
        .form-side { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 12%; background: #ffffff; }
        .form-container { width: 100%; max-width: 400px; margin: 0 auto; }
        h2 { font-size: 24px; color: #111; margin-bottom: 12px; }
        .divider { height: 12px; width: 60%; background-color: #d9d9d9; margin-bottom: 24px; border-radius: 2px; }
        
        /* Inputs & Labels */
        label { display: block; font-size: 11px; font-weight: bold; color: #333; margin-top: 16px; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #d1d1d1; border-radius: 4px; font-size: 14px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #111; }
        
        /* Checkbox */
        .checkbox-group { display: flex; align-items: center; margin-top: 16px; gap: 8px; }
        .checkbox-group label { margin: 0; font-weight: normal; font-size: 11px; color: #555; }
        .checkbox-group strong { color: #111; }

        /* Buttons & Text */
        .btn-black { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 4px; font-weight: bold; margin-top: 24px; cursor: pointer; transition: 0.2s; }
        .btn-black:hover { background: #333; }
        .switch-text { text-align: center; font-size: 12px; margin-top: 16px; color: #555; }
        .switch-text a { color: #111; font-weight: bold; text-decoration: none; cursor: pointer; }
        
        /* Image Carousel Side */
        .image-side { 
            flex: 1; 
            background: #000; 
            position: relative; 
            overflow: hidden; 
        }
        .carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .carousel-slide {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            color: #333;
            border: none;
            cursor: pointer;
            padding: 12px 16px;
            font-size: 20px;
            border-radius: 50%;
            z-index: 10;
            transition: background 0.3s;
        }
        .carousel-btn:hover {
            background: rgba(255, 255, 255, 1);
        }
        .carousel-btn.prev {
            left: 20px;
        }
        .carousel-btn.next {
            right: 20px;
        }
    </style>
</head>
<body>

    <div class="split-layout">
        
        <!-- Left Form Container -->
        <div class="form-side">
            <div class="form-container">
                <h2>Create your account</h2>
                <div class="divider"></div>
                
                <label>Full name</label>
                <input type="text" placeholder="........">
                
                <label>Email address or phone number</label>
                <input type="text" placeholder="........">
                
                <label>Password</label>
                <input type="password" placeholder="........">
                
                <label>Confirm password</label>
                <input type="password" placeholder="........">
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the <strong>Terms of Service</strong> and <strong>Privacy Policy</strong>.</label>
                </div>
                
                <button class="btn-black">Sign Up</button>
                <p class="switch-text">Already have an account? <a>Log in.</a></p>
            </div>
        </div>

        <!-- Right Image Container (Updated to Carousel) -->
        <div class="image-side">
            <div class="carousel-container">
                <div class="carousel-slide">
                    <img src="fuji.jpg" alt="Mount Fuji, Japan">
                    <img src="kyoto.jpg" alt="Kyoto, Japan">
                    <img src="tokyo.jpg" alt="Tokyo, Japan">
                </div>
                
                <!-- Navigation Buttons -->
                <button id="prevBtn" class="carousel-btn prev">&#10094;</button>
                <button id="nextBtn" class="carousel-btn next">&#10095;</button>
            </div>
        </div>

    </div>

    <!-- JavaScript for sliding functionality -->
    <script>
        const carouselSlide = document.querySelector('.carousel-slide');
        const images = document.querySelectorAll('.carousel-slide img');
        const prevBtn = document.querySelector('#prevBtn');
        const nextBtn = document.querySelector('#nextBtn');

        let counter = 0;

        // Moves the slide based on the current counter
        function updateSlide() {
            carouselSlide.style.transform = `translateX(${-counter * 100}%)`;
        }

        // Next Button Logic
        nextBtn.addEventListener('click', () => {
            if (counter >= images.length - 1) {
                counter = 0; // Go back to first image
            } else {
                counter++; // Go to next image
            }
            updateSlide();
        });

        // Previous Button Logic
        prevBtn.addEventListener('click', () => {
            if (counter <= 0) {
                counter = images.length - 1; // Go to last image
            } else {
                counter--; // Go to previous image
            }
            updateSlide();
        });
    </script>
</body>
</html>
