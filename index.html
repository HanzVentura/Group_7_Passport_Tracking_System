<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="split-layout">
        <div class="form-side">
            <div class="form-container">
                <h1>Create your account</h1>
                <p class="subtitle">Prepare for a world-wide journey!</p>

                <form action="#">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname">
                    </div>

                    <div class="input-group">
                        <label for="email">Email address or phone number</label>
                        <input type="text" id="email" name="email">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" name="confirm-password">
                            <span class="show-password">Show Password</span>
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms">
                        <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                    </div>

                    <button type="submit" class="btn-signup">Sign Up</button>
                </form>

                <p class="login-text">Already have an account? <a href="#">Log In</a></p>
            </div>
            
            <div class="clouds-bg"></div>
        </div>

        <div class="image-side">
            <div class="carousel-container">
                <div class="slide active" style="background-image: url('Images/GREECE.jpg');"></div>
                <div class="slide" style="background-image: url('Images/ITALY.jpg');"></div>
                <div class="slide" style="background-image: url('Images/JAPAN.jpg');"></div>
                <div class="slide" style="background-image: url('Images/NEWYORK.jpg');"></div>
                <div class="slide" style="background-image: url('Images/SWITZERLAND.jpg');"></div>

                <button class="nav-arrow prev" onclick="changeSlide(-1)">&#10094;</button>
                <button class="nav-arrow next" onclick="changeSlide(1)">&#10095;</button>

                <div class="carousel-dots">
                    <span class="dot active" onclick="setSlide(0)"></span>
                    <span class="dot" onclick="setSlide(1)"></span>
                    <span class="dot" onclick="setSlide(2)"></span>
                    <span class="dot" onclick="setSlide(3)"></span>
                    <span class="dot" onclick="setSlide(4)"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
